name: build
on:
  push:
    branches: [ccr-f1bf92dd-we61zz]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: chmod +x gradlew
      - run: ./gradlew assembleDebug -PvcRun=${{ github.run_number }} --no-daemon
      - run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/baixar-pro-telegram.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: baixar-ultima
          name: Baixar pro Telegram (última)
          files: out/baixar-pro-telegram.apk
          prerelease: true
          make_latest: false
